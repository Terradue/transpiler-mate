[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "transpiler-mate"
dynamic = ["version"]
description = 'Schema.org 2 metadata formats transpiler'

readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = []
authors = [
  { name = "Fabrice Brito", email = "info@terradue.com" },
  { name = "Simone Tripodi", email = "info@terradue.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click==8.4.2",
  "cwl2ogc==0.19.0",
  "cwl-loader==0.25.0",
  "email-validator==2.3.0",
  "giturlparse==0.15.0",
  "invenio-rest-api-client==12.0.3",
  "Jinja2==3.1.6",
  "loguru==0.7.3",
  "pydantic==2.13.4",
  "ruamel.yaml<0.20", # cwl-utils 0.42 depends on ruamel.yaml<0.19 and >=0.17.6
  "semver==3.0.4",
  "session-adapters==0.5.0",
  "yaml-ld==1.1.17" # >=1.1.18 requires Python3.11
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://terradue.github.io/transpiler-mate/"
Issues = "https://github.com/Terradue/transpiler-mate/issues"
Source = "https://github.com/Terradue/transpiler-mate"

[project.scripts]
transpiler-mate = "transpiler_mate.cli.cli:main"

[tool.hatch.version]
path = "src/transpiler_mate/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy==1.19.1",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/transpiler_mate tests}"

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["transpiler_mate", "tests"]
branch = true
parallel = true
omit = [
  "src/transpiler_mate/__about__.py",
]

[tool.coverage.paths]
transpiler_mate = ["src/transpiler_mate", "*/transpiler_mate/src/transpiler_mate"]
tests = ["tests", "*/transpiler_mate/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=transpiler-mate --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves these annotations while rebuilding model schemas.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "TranspilerBaseModel",
  "transpiler_mate.TranspilerBaseModel",
]

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src/transpiler_mate}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"
